[project]
name = "telegram-bot-core"
version = "0.1.0"
description = "Shared fail-closed Telegram authorization and message utilities"
readme = "README.md"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
